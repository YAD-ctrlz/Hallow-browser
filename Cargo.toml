[workspace]
resolver = "3"
members = ["tools/hallow-build"]

[profile.release]
opt-level = 3
codegen-units = 16

# The tool hashes and (de)compresses multi-gigabyte files; keep dependencies
# fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3

# Icon rendering in the tests is pixel-by-pixel; keep the tool itself
# reasonably fast in debug builds too.
[profile.dev]
opt-level = 1
