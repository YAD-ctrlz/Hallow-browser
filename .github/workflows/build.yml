name: Development build

# Builds and tests Hallow for Linux and Windows from every branch except
# release, and from pull requests. The packages it makes are CI artifacts for
# testing only:
#   - the workflow has a read-only token and never uses the `production`
#     environment, which holds the update channel's signing keys, so it
#     cannot publish a release or sign Hallow's stable update channel;
#   - its versions carry a ~dev suffix (157.0-7~dev42), which sorts before
#     the release they lead up to;
#   - Windows builds sign their update package with a throwaway key made for
#     the run and deleted with it; no release build trusts that key.
# Installed Hallows only ever update from the stable channel, which only the
# Release workflow publishes, from the release branch.
# Changes to the tests alone are run by package-tests.yml against the newest
# build instead of rebuilding.

on:
  push:
    branches-ignore: [release]
    paths:
      - hallow.toml
      - mozconfig
      - gecko/**
      - patches/**
      - branding/**
      - prefs/**
      - ui/**
      - packaging/**
      - tools/hallow-build/**
      - tools/make-apt-repo.sh
      - tools/make-windows-update-tests.sh
      - Cargo.lock
      - .github/actions/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - hallow.toml
      - mozconfig
      - gecko/**
      - patches/**
      - branding/**
      - prefs/**
      - ui/**
      - packaging/**
      - tools/hallow-build/**
      - tools/make-apt-repo.sh
      - tools/make-windows-update-tests.sh
      - Cargo.lock
      - .github/actions/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Rust release Mozilla builds this Gecko with
  # (taskcluster/kinds/toolchain/rust.yml in the Firefox source).
  GECKO_RUST: "1.95.0"
  HALLOW_SCCACHE: "1"
  SCCACHE_CACHE_SIZE: 6G
  HALLOW_VERSION_SUFFIX: "~dev${{ github.run_number }}"

jobs:
  build:
    name: Build (LTO, no PGO)
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gecko-setup

      - id: version
        run: echo "version=$(cargo hb version)" >> "$GITHUB_OUTPUT"

      - name: Check prefs against this Firefox
        run: cargo hb lint-prefs --strict

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-dev-${{ github.run_id }}
          restore-keys: sccache-dev-

      - name: Compile Gecko (mach build + package)
        run: cargo hb build --bootstrap

      - name: Save compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-dev-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build .deb
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo hb deb

      - uses: actions/upload-artifact@v4
        with:
          name: hallow-dev-deb
          path: dist/*.deb
          retention-days: 14
          if-no-files-found: error

  test:
    name: Test the package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hallow-dev-deb
          path: dist
      - name: Install and test
        run: bash tools/test-package.sh dist/hallow_*.deb results
      - name: Print screenshots as base64
        if: always()
        run: tools/print-screenshots.sh results
      - name: Summary
        if: always()
        run: cat results/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/

  build-windows:
    name: Build for Windows (LTO, no PGO)
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      HALLOW_TARGET: windows
    steps:
      - uses: actions/checkout@v5

      - name: Throwaway update signing key for this run
        run: |
          # The updater of this build trusts Hallow's release key (when it
          # exists) and this key, which signs the run's test updates and is
          # deleted with the runner.
          openssl req -x509 -newkey rsa:4096 -nodes -days 30 \
            -subj "/CN=Hallow development build ${{ github.run_number }}" \
            -keyout "$RUNNER_TEMP/dev-update.key" \
            -outform DER -out "$RUNNER_TEMP/dev-update.der" 2>/dev/null
          certs="$RUNNER_TEMP/dev-update.der"
          if [ -f packaging/windows/hallow-update-signing.der ]; then
            certs="$PWD/packaging/windows/hallow-update-signing.der,$certs"
          fi
          echo "HALLOW_UPDATE_CERTS=$certs" >> "$GITHUB_ENV"

      - uses: ./.github/actions/gecko-setup

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-win-${{ github.run_id }}
          restore-keys: sccache-win-

      - name: Cross-compile Gecko for Windows (mach build + package)
        run: cargo hb build --bootstrap

      - name: Save compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-win-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Installer, zip and update package
        run: cargo hb windows-dist

      - name: Sign the update package and make the update test packages
        run: |
          bash tools/make-windows-update-tests.sh dist dist/update-tests \
            "$RUNNER_TEMP/dev-update.key" "$RUNNER_TEMP/dev-update.der"

      - name: Delete the throwaway key
        if: always()
        run: rm -f "$RUNNER_TEMP/dev-update.key"

      - uses: actions/upload-artifact@v4
        with:
          name: hallow-dev-windows
          path: |
            dist/hallow-*-win64-setup.exe
            dist/hallow-*-win64.zip
            dist/hallow-*-win64.complete.mar
            dist/hallow-*-win64.json
            dist/windows-icons/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: hallow-dev-windows-update-tests
          path: dist/update-tests/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

  test-windows:
    name: Test on Windows
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hallow-dev-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: hallow-dev-windows-update-tests
          path: dist/update-tests
      - name: Install and test
        shell: pwsh
        run: tools/test-windows.ps1 -Dist dist -Results results
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-Content results/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: results/
