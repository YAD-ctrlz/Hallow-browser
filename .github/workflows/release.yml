name: Release

# Builds Hallow from the Firefox release pinned in hallow.toml and publishes
# hallow_<version>_amd64.deb as a GitHub release tagged v<version>.
# A release is built once per version: increase [hallow].revision in
# hallow.toml (or run `cargo hb bump` for a new Firefox) to ship changes.
#
# Like Firefox's own release builds, Hallow is built with profile-guided
# optimization (PGO) on top of cross-language LTO, in three stages:
#   1. an instrumented build,
#   2. a training run of Mozilla's PGO corpus with it (under Xvfb),
#   3. the final build, optimized with the recorded profile.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and replace the assets even if the release exists
        type: boolean
        default: false
      pgo:
        description: Profile-guided optimization (three build stages)
        type: boolean
        default: true
  push:
    branches: [main, development]
    paths:
      - hallow.toml
      - mozconfig
      - patches/**
      - branding/**
      - prefs/**
      - ui/**
      - packaging/**
      - tools/**
      - Cargo.lock
      - .github/actions/**
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Rust release Mozilla builds this Gecko with
  # (taskcluster/kinds/toolchain/rust.yml in the Firefox source).
  GECKO_RUST: "1.95.0"
  HALLOW_SCCACHE: "1"
  SCCACHE_CACHE_SIZE: 6G

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      firefox: ${{ steps.plan.outputs.firefox }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      pgo: ${{ steps.plan.outputs.pgo }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tool-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tool-${{ runner.os }}-
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          PGO_INPUT: ${{ inputs.pgo }}
        run: |
          version=$(cargo hb version)
          tag="v$version"
          build=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            build=false
            echo "::notice::Release $tag already exists. Increase [hallow].revision in hallow.toml to publish a new build."
          fi
          pgo=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$PGO_INPUT" = false ]; then
            pgo=false
          fi
          {
            echo "version=$version"
            echo "firefox=$(cargo hb version --firefox)"
            echo "tag=$tag"
            echo "build=$build"
            echo "pgo=$pgo"
          } >> "$GITHUB_OUTPUT"

  pgo-instrumented:
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.pgo == 'true'
    name: PGO 1/3 · instrumented build
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      HALLOW_PGO: generate
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gecko-setup

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-instr-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}
          restore-keys: |
            sccache-instr-${{ needs.plan.outputs.firefox }}-
            sccache-instr-

      - name: Compile instrumented Gecko
        run: cargo hb build --bootstrap

      - name: Save compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-instr-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect the instrumented package
        run: cp "$HALLOW_WORK_DIR"/firefox-*/obj-hallow/dist/hallow-*.linux-x86_64.tar.xz "$RUNNER_TEMP/instrumented.tar.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: pgo-instrumented
          path: ${{ runner.temp }}/instrumented.tar.xz
          retention-days: 3
          if-no-files-found: error

  pgo-profile:
    needs: [plan, pgo-instrumented]
    name: PGO 2/3 · training run
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gecko-setup
      - name: Install Xvfb
        run: sudo apt-get install -y -q xvfb
      - uses: actions/download-artifact@v4
        with:
          name: pgo-instrumented
          path: ${{ runner.temp }}/instrumented
      - name: Run Mozilla's PGO corpus
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            cargo hb profile "$RUNNER_TEMP/instrumented/instrumented.tar.xz" --out "$RUNNER_TEMP/pgo"
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-profile
          path: ${{ runner.temp }}/pgo/
          retention-days: 3
          if-no-files-found: error

  build:
    needs: [plan, pgo-profile]
    # Runs after the PGO stages, or straight away when PGO is switched off.
    if: >-
      always() && needs.plan.outputs.build == 'true' &&
      (needs.pgo-profile.result == 'success' || needs.plan.outputs.pgo != 'true')
    name: Build Hallow ${{ needs.plan.outputs.version }}${{ needs.plan.outputs.pgo == 'true' && ' (PGO 3/3)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gecko-setup

      - name: Check prefs against this Firefox
        run: cargo hb lint-prefs

      - name: Download the PGO profile
        if: needs.plan.outputs.pgo == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pgo-profile
          path: ${{ runner.temp }}/pgo

      - name: Use the PGO profile
        if: needs.plan.outputs.pgo == 'true'
        run: |
          ls -la "$RUNNER_TEMP/pgo"
          echo "HALLOW_PGO=use" >> "$GITHUB_ENV"
          echo "HALLOW_PGO_DIR=$RUNNER_TEMP/pgo" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ needs.plan.outputs.firefox }}-
            sccache-

      - name: Compile Gecko (mach build + package)
        run: cargo hb build --bootstrap

      - name: Save compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build .deb
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo hb deb

      - name: Install and launch the package
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ./dist/hallow_*.deb xvfb imagemagick
          dpkg -s hallow | head -n 3
          hallow --version | tee version.txt
          grep -q "${{ needs.plan.outputs.firefox }}" version.txt
          ls /usr/lib/hallow/fonts /usr/share/icons/hicolor/512x512/apps/hallow.png
          bash tools/screenshot.sh /usr/bin/hallow screenshots
          sudo apt-get remove -y -q hallow

      - name: Print screenshots as base64
        run: |
          for png in screenshots/*.png; do
            convert "$png" -resize 1100x -quality 65 "${png%.png}.jpg"
            echo "::group::${png%.png}.jpg (base64)"
            base64 "${png%.png}.jpg"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hallow-deb
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hallow-deb
          path: dist

      - name: Publish ${{ needs.plan.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          FIREFOX: ${{ needs.plan.outputs.firefox }}
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          deb=$(ls *.deb)
          cat > notes.md <<EOF
          Hallow $VERSION, built from the Firefox $FIREFOX source release with
          profile-guided and cross-language link-time optimization.

          ### Install (Debian 12+, Ubuntu 22.04+, amd64)

          \`\`\`sh
          sudo apt install ./$deb
          \`\`\`

          Then start **Hallow** from your app menu or run \`hallow\`.

          ### SHA-256

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$deb" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$deb" SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Hallow $VERSION" \
              --notes-file notes.md \
              --latest
          fi
