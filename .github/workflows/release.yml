name: Release

# Hallow's production pipeline (continuous delivery). The release branch is
# the source of truth for stable Hallow: every commit that reaches it is
# built, tested and published here, and nothing else ever is.
#
#   release branch commit
#   -> Linux: PGO + LTO build (three stages, like Firefox's own release
#      builds); Windows: LTO build, cross-compiled
#   -> tests of both (install, desktop integration, icons, browser checks,
#      updates)
#   -> the `production` environment: sign Hallow's stable update channels
#      (the APT repository with the archive key, the Windows update package
#      with the update signing key), attest the packages' provenance, stage
#      GitHub release v<version> as a draft
#   -> a Windows machine installs this build and updates it with the signed
#      package, exactly as installed Hallows will
#   -> the release is published as the latest release: installed Hallows
#      find the update (Hallow's update check, or the system's update
#      manager on Linux) and install it after verifying its signature.
#
# Safeguards: the workflow refuses to run for anything but the release
# branch; the signing keys are secrets of the `production` environment, which
# only admits the release branch (see docs/RELEASING.md); a release is only
# published after every test passed, and the packages' versions, tag and
# commit must match. Development builds come from build.yml and are never
# published.

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and replace the assets of an existing release
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, and never cancel one that may be publishing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The Rust release Mozilla builds this Gecko with
  # (taskcluster/kinds/toolchain/rust.yml in the Firefox source).
  GECKO_RUST: "1.95.0"
  HALLOW_SCCACHE: "1"
  SCCACHE_CACHE_SIZE: 6G
  ARCHIVE_KEY: packaging/linux/hallow-archive-keyring.asc
  UPDATE_CERT: packaging/windows/hallow-update-signing.der

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      firefox: ${{ steps.plan.outputs.firefox }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Only the release branch publishes Hallow
        run: |
          if [ "$GITHUB_REF" != refs/heads/release ]; then
            echo "::error::Stable Hallow releases are built from the release branch only, not $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The commit is on the release branch
        run: |
          git fetch -q origin release
          git merge-base --is-ancestor "$GITHUB_SHA" origin/release
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tool-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tool-${{ runner.os }}-
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          unset HALLOW_VERSION_SUFFIX
          version=$(cargo hb version)
          case "$version" in
            *[~+]*) echo "::error::$version is not a release version"; exit 1 ;;
          esac
          if [ ! -s "$ARCHIVE_KEY" ]; then
            echo "::error::$ARCHIVE_KEY is missing: a release must carry the update channel's public key. See docs/RELEASING.md."
            exit 1
          fi
          if [ ! -s "$UPDATE_CERT" ]; then
            echo "::error::$UPDATE_CERT is missing: Windows builds must trust Hallow's update signing key. See docs/RELEASING.md."
            exit 1
          fi
          tag="v$version"
          build=true
          # A version is released from exactly one commit.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged=$(git rev-list -n 1 "$tag")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag was released from $tagged. Increase [hallow].revision in hallow.toml for a new release."
              exit 1
            fi
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != true ]; then
            build=false
            echo "::notice::Release $tag already exists. Increase [hallow].revision in hallow.toml to publish a new build."
          fi
          {
            echo "version=$version"
            echo "firefox=$(cargo hb version --firefox)"
            echo "tag=$tag"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  pgo-instrumented:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: PGO 1/3 · instrumented build
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      HALLOW_PGO: generate
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gecko-setup

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-instr-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}
          restore-keys: |
            sccache-instr-${{ needs.plan.outputs.firefox }}-
            sccache-instr-

      - name: Compile instrumented Gecko
        run: cargo hb build --bootstrap

      - name: Save compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-instr-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect the instrumented package
        run: cp "$HALLOW_WORK_DIR"/firefox-*/obj-hallow/dist/hallow-*.linux-x86_64.tar.xz "$RUNNER_TEMP/instrumented.tar.xz"

      - uses: actions/upload-artifact@v4
        with:
          name: pgo-instrumented
          path: ${{ runner.temp }}/instrumented.tar.xz
          retention-days: 3
          if-no-files-found: error

  pgo-profile:
    needs: [plan, pgo-instrumented]
    name: PGO 2/3 · training run
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gecko-setup
      - name: Install Xvfb
        run: sudo apt-get install -y -q xvfb
      - uses: actions/download-artifact@v4
        with:
          name: pgo-instrumented
          path: ${{ runner.temp }}/instrumented
      - name: Run Mozilla's PGO corpus
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            cargo hb profile "$RUNNER_TEMP/instrumented/instrumented.tar.xz" --out "$RUNNER_TEMP/pgo"
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-profile
          path: ${{ runner.temp }}/pgo/
          retention-days: 3
          if-no-files-found: error

  build:
    needs: [plan, pgo-profile]
    name: Build Hallow ${{ needs.plan.outputs.version }} (PGO 3/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gecko-setup

      - name: Check prefs against this Firefox
        run: cargo hb lint-prefs --strict

      - uses: actions/download-artifact@v4
        with:
          name: pgo-profile
          path: ${{ runner.temp }}/pgo

      - name: Use the PGO profile
        run: |
          ls -la "$RUNNER_TEMP/pgo"
          echo "HALLOW_PGO=use" >> "$GITHUB_ENV"
          echo "HALLOW_PGO_DIR=$RUNNER_TEMP/pgo" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ needs.plan.outputs.firefox }}-
            sccache-

      - name: Compile Gecko (mach build + package)
        run: cargo hb build --bootstrap

      - name: Save compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build .deb
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo hb deb --require-update-channel
          test "$(dpkg-deb -f dist/hallow_*.deb Version)" = "${{ needs.plan.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hallow-deb
          path: dist/*.deb
          if-no-files-found: error

  test:
    needs: [plan, build]
    name: Test the package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hallow-deb
          path: dist
      - name: Install and test
        run: bash tools/test-package.sh dist/hallow_*.deb results
      - name: Print screenshots as base64
        if: always()
        run: tools/print-screenshots.sh results
      - name: Summary
        if: always()
        run: cat results/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/

  build-windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: Build Hallow ${{ needs.plan.outputs.version }} for Windows
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      HALLOW_TARGET: windows
    steps:
      - uses: actions/checkout@v5
      # No HALLOW_UPDATE_CERTS: the updater trusts Hallow's update signing
      # key ($UPDATE_CERT) and nothing else.
      - uses: ./.github/actions/gecko-setup

      - name: The updater trusts only Hallow's update signing key
        run: |
          src="$HALLOW_WORK_DIR/firefox-$(cargo hb version --firefox)"
          cmp "$UPDATE_CERT" "$src/toolkit/mozapps/update/updater/release_primary.der"
          cmp "$UPDATE_CERT" "$src/toolkit/mozapps/update/updater/release_secondary.der"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-win-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}
          restore-keys: |
            sccache-win-${{ needs.plan.outputs.firefox }}-
            sccache-win-

      - name: Cross-compile Gecko for Windows (mach build + package)
        run: cargo hb build --bootstrap

      - name: Save compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-win-${{ needs.plan.outputs.firefox }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Installer, zip and update package
        run: |
          cargo hb windows-dist
          test "$(jq -r .version dist/hallow-*-win64.json)" = "${{ needs.plan.outputs.version }}"

      - name: Update test packages (packages that must be refused)
        run: bash tools/make-windows-update-tests.sh dist dist/update-tests

      - uses: actions/upload-artifact@v4
        with:
          name: hallow-windows
          path: |
            dist/hallow-*-win64-setup.exe
            dist/hallow-*-win64.zip
            dist/hallow-*-win64.complete.mar
            dist/hallow-*-win64.json
            dist/windows-icons/
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: hallow-windows-update-tests
          path: dist/update-tests/
          if-no-files-found: error
          compression-level: 0

  test-windows:
    needs: [plan, build-windows]
    name: Test on Windows
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hallow-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: hallow-windows-update-tests
          path: dist/update-tests
      - name: Install and test
        shell: pwsh
        run: tools/test-windows.ps1 -Dist dist -Results results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: results/

  publish:
    needs: [plan, build, test, build-windows, test-windows]
    name: Sign and stage ${{ needs.plan.outputs.tag }}
    runs-on: ubuntu-24.04
    # Holds HALLOW_SIGNING_KEY and HALLOW_MAR_SIGNING_KEY. Restrict its
    # deployment branches to `release` (Settings > Environments) so no other
    # branch can sign.
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      FIREFOX: ${{ needs.plan.outputs.firefox }}
    steps:
      - name: Only the release branch publishes Hallow
        run: test "$GITHUB_REF" = refs/heads/release

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: hallow-deb
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: hallow-windows
          path: windows

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tool-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tool-${{ runner.os }}-

      - name: Sign the Windows update package
        env:
          HALLOW_MAR_SIGNING_KEY: ${{ secrets.HALLOW_MAR_SIGNING_KEY }}
        run: |
          if [ -z "$HALLOW_MAR_SIGNING_KEY" ]; then
            echo "::error::The production environment has no HALLOW_MAR_SIGNING_KEY secret. See docs/RELEASING.md."
            exit 1
          fi
          test "$(jq -r .version windows/hallow-*-win64.json)" = "$VERSION"
          key="$RUNNER_TEMP/update-signing.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$HALLOW_MAR_SIGNING_KEY" > "$key")
          mar=$(ls windows/hallow-*-win64.complete.mar)
          mkdir -p signed
          # Signs, then checks the signature against the certificate built
          # into Windows Hallow's updater, as the updater will.
          cargo hb mar sign "$mar" "signed/$(basename "$mar")" --key "$key" --cert "$UPDATE_CERT"
          cargo hb mar verify "signed/$(basename "$mar")" --cert "$UPDATE_CERT"
          cargo hb mar info "signed/$(basename "$mar")" | head -3

      - name: Windows update manifest
        run: |
          mar=$(ls signed/hallow-*-win64.complete.mar)
          cargo hb update-xml --mar "$mar" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$mar")" \
            --info windows/hallow-*-win64.json \
            --details-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --output signed/update-win64.xml
          cat signed/update-win64.xml

      - uses: actions/upload-artifact@v4
        with:
          name: hallow-windows-signed
          path: signed/
          if-no-files-found: error
          compression-level: 0

      - name: Import the archive signing key
        env:
          HALLOW_SIGNING_KEY: ${{ secrets.HALLOW_SIGNING_KEY }}
        run: |
          if [ -z "$HALLOW_SIGNING_KEY" ]; then
            echo "::error::The production environment has no HALLOW_SIGNING_KEY secret. See docs/RELEASING.md."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$HALLOW_SIGNING_KEY" | gpg --batch --import
          # The key must be the one installed Hallows trust (the public key
          # shipped in the package), or they would reject the update.
          secret=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          public=$(gpg --batch --with-colons --show-keys "$ARCHIVE_KEY" | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$secret" ] || [ "$secret" != "$public" ]; then
            echo "::error::HALLOW_SIGNING_KEY ($secret) does not match $ARCHIVE_KEY ($public)."
            exit 1
          fi
          echo "SIGNING_KEY=$secret" >> "$GITHUB_ENV"
          echo "Signing with $secret"

      - name: Sign the stable update channel
        run: |
          sudo apt-get install -y -q apt-utils
          deb=$(ls dist/*.deb)
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
          tools/make-apt-repo.sh "$deb" channel "$SIGNING_KEY"
          ls -la channel

      - name: Verify the channel the way installed Hallows will
        run: |
          # APT, a fresh state directory and only the shipped public key:
          # the channel must verify and offer exactly this version.
          state=$(mktemp -d)
          mkdir -p "$state/lists/partial" "$state/archives/partial" "$state/root/latest"
          ln -s "$PWD/channel" "$state/root/latest/download"
          printf 'Types: deb\nURIs: file://%s/root/latest/\nSuites: download/\nSigned-By: %s\n' \
            "$state" "$PWD/$ARCHIVE_KEY" > "$state/hallow.sources"
          opts=(-o "Dir::Etc::SourceList=$state/hallow.sources" -o Dir::Etc::SourceParts=-
                -o "Dir::State::Lists=$state/lists" -o "Dir::Cache=$state" -o Debug::NoLocking=true)
          apt-get "${opts[@]}" update
          apt-cache "${opts[@]}" policy hallow | tee "$state/policy"
          grep -q "Candidate: $VERSION\$" "$state/policy"

      - name: Attest the packages' provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            windows/hallow-*-win64-setup.exe
            windows/hallow-*-win64.zip
            signed/hallow-*-win64.complete.mar

      - name: Stage ${{ needs.plan.outputs.tag }} as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          deb=$(basename "$(ls dist/*.deb)")
          setup=$(basename "$(ls windows/hallow-*-win64-setup.exe)")
          winzip=$(basename "$(ls windows/hallow-*-win64.zip)")
          mar=$(basename "$(ls signed/hallow-*-win64.complete.mar)")
          cp "windows/$setup" "windows/$winzip" "signed/$mar" signed/update-win64.xml channel/
          (cd channel && sha256sum "$deb" "$setup" "$winzip" "$mar" > SHA256SUMS)
          cat > notes.md <<EOF
          Hallow $VERSION, built from the Firefox $FIREFOX source release with
          cross-language link-time optimization (and profile-guided
          optimization on Linux).

          ### Install on Windows 10 and 11 (64-bit)

          Download and run **$setup**. Hallow installs for your user account,
          without administrator rights, and keeps itself up to date: it
          checks this stable channel and installs new versions in the
          background, verified with Hallow's signing key.

          ### Install on Linux (Debian 12+, Ubuntu 22.04+, Linux Mint 21+, amd64)

          \`\`\`sh
          sudo apt install ./$deb
          \`\`\`

          Installed Hallow keeps itself up to date: it checks this stable
          channel daily and in *About Hallow*, and installs new versions after
          you confirm with your password. Your system's update manager offers
          them too.

          ### Provenance

          - Built from release-branch commit \`$GITHUB_SHA\` by [this workflow run]($RUN_URL).
          - Linux update channel signed with key \`$SIGNING_KEY\`; Windows update
            package signed with the key of \`packaging/windows/hallow-update-signing.der\`.
          - Verify a download: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`

          ### SHA-256

          \`\`\`
          $(cat channel/SHA256SUMS)
          \`\`\`
          EOF
          assets=(channel/"$deb" channel/SHA256SUMS channel/InRelease channel/Release
                  channel/Release.gpg channel/Packages channel/Packages.xz
                  channel/"$setup" channel/"$winzip" channel/"$mar" channel/update-win64.xml)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A forced rebuild of an existing release.
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            # Everything goes into a draft first, so the moment the release
            # becomes "latest" (and thus the stable channel) it is complete
            # and its Windows update has been installed once (go-live).
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Hallow $VERSION" \
              --notes-file notes.md \
              --draft
          fi

  verify-windows-update:
    needs: [plan, publish]
    name: Install the signed Windows update
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hallow-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: hallow-windows-update-tests
          path: dist/update-tests
      - uses: actions/download-artifact@v4
        with:
          name: hallow-windows-signed
          path: dist/signed
      - name: Install this build and update it with the signed package
        shell: pwsh
        # With dist/signed present, the update stage installs the package
        # signed with the release key, through the About dialog, like an
        # installed Hallow updating from the stable channel.
        run: tools/test-windows.ps1 -Dist dist -Results results -Stages install,updates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-update
          path: results/

  go-live:
    needs: [plan, publish, verify-windows-update]
    name: Publish ${{ needs.plan.outputs.tag }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Only the release branch publishes Hallow
        run: test "$GITHUB_REF" = refs/heads/release
      - uses: actions/checkout@v5
      - name: Make ${{ needs.plan.outputs.tag }} the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          # The published tag must point at the commit that was built.
          git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
