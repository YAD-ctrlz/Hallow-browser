name: Track Firefox releases

# Daily: when Mozilla ships a new Firefox release, point hallow.toml at it on
# the development branch and start a development build, so Hallow stays on
# the newest Gecko. Releasing it is a separate, deliberate step: promoting
# development into the release branch (docs/RELEASING.md).

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: development
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tool-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tool-${{ runner.os }}-
      - id: bump
        run: cargo hb bump
      - name: Commit to development and start a development build
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update to Firefox $VERSION"
          git push origin HEAD:development
          # Pushes made with GITHUB_TOKEN do not trigger workflows; ask directly.
          gh workflow run build.yml --ref development
