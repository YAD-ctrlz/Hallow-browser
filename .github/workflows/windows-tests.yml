name: Windows tests

# Re-runs the Windows tests (tools/test-windows.ps1) against the newest
# development build of this branch, without rebuilding Gecko: for changes to
# the tests themselves. Read-only, like every development workflow.

on:
  push:
    branches-ignore: [release]
    paths:
      - tools/test-windows.ps1
      - tools/test_windows.py
      - tools/test_windows_updates.py
      - tools/test_browser.py
      - tools/marionette.py
      - .github/workflows/windows-tests.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Find the newest Windows development build of this branch
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
              --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId -q '.[].databaseId'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                -q '.artifacts[] | select(.name == "hallow-dev-windows" and (.expired | not)) | .id' | grep -q .; then
              echo "run=$run" >> "$GITHUB_OUTPUT"
              echo "Testing the Windows build of run $run"
              exit 0
            fi
          done
          echo "::error::No Windows development build of $GITHUB_REF_NAME to test"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: hallow-dev-windows
          path: dist
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: hallow-dev-windows-update-tests
          path: dist/update-tests
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}

      - name: Install and test
        shell: pwsh
        run: tools/test-windows.ps1 -Dist dist -Results results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: results/
