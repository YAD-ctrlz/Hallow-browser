name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tool:
    name: Build tool (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tool-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tool-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  upstream-source:
    name: Patches and prefs apply to Firefox
    runs-on: ubuntu-24.04
    env:
      HALLOW_WORK_DIR: /mnt/hallow/work
    steps:
      - uses: actions/checkout@v5
      - name: Prepare work directory
        run: sudo mkdir -p /mnt/hallow && sudo chown "$USER" /mnt/hallow
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tool-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tool-${{ runner.os }}-
      - name: Fetch Firefox source
        run: cargo hb fetch
      - name: Apply patches and branding
        run: cargo hb prepare
      - name: Check prefs against Firefox
        run: cargo hb lint-prefs --strict

  search-engine:
    name: Startpage endpoints respond
    runs-on: ubuntu-24.04
    steps:
      # Hallow's default search engine is defined in
      # patches/0003-startpage-default-search-engine.patch; make sure the
      # search and suggestion URLs it uses still work.
      - name: Query Startpage
        run: |
          ua="Mozilla/5.0 (X11; Linux x86_64; rv:157.0) Gecko/20100101 Firefox/157.0"
          # Datacenter IPs like GitHub's get redirected (303) to a captcha;
          # anything but 200/303 means the search URL format broke.
          code=$(curl -sS --retry 3 -A "$ua" -o /dev/null -w "%{http_code}" \
            "https://www.startpage.com/sp/search?q=hallow+browser")
          echo "search: HTTP $code"
          case "$code" in 200|303) ;; *) exit 1 ;; esac
          curl -fsS --retry 3 -A "$ua" -o suggest.json \
            "https://www.startpage.com/osuggestions?q=hallow"
          head -c 300 suggest.json; echo
          python3 -c "import json; d = json.load(open('suggest.json')); assert d[0] == 'hallow' and d[1], d"
