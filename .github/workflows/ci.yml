name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tool:
    name: Build tool (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tool-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tool-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  upstream-source:
    name: Patches and prefs apply to Firefox
    runs-on: ubuntu-24.04
    env:
      HALLOW_WORK_DIR: /mnt/hallow/work
    steps:
      - uses: actions/checkout@v5
      - name: Prepare work directory
        run: sudo mkdir -p /mnt/hallow && sudo chown "$USER" /mnt/hallow
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tool-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tool-${{ runner.os }}-
      - name: Fetch Firefox source
        run: cargo hb fetch
      - name: Apply patches and branding
        run: cargo hb prepare
      - name: Check prefs against Firefox
        run: cargo hb lint-prefs --strict

  search-engine:
    name: Startpage endpoints respond
    runs-on: ubuntu-24.04
    steps:
      # Hallow's default search engine is defined in
      # patches/0003-startpage-default-search-engine.patch; make sure the
      # search and suggestion URLs it uses still work.
      - name: Query Startpage
        run: |
          ua="Mozilla/5.0 (X11; Linux x86_64; rv:157.0) Gecko/20100101 Firefox/157.0"
          probe() {
            echo "== $1"
            curl -sS -A "$ua" -H "Accept-Language: en-US,en;q=0.5" -o body -D headers \
              -w "HTTP %{http_code} -> %{redirect_url}\n" "$1" || true
            grep -i '^content-type' headers || true
            head -c 240 body; echo
          }
          probe "https://www.startpage.com/sp/search?q=hallow+browser"
          probe "https://www.startpage.com/suggestions?format=opensearch&q=hallow"
          probe "https://www.startpage.com/suggestions?q=hallow"
          probe "https://www.startpage.com/suggestions?partner=apex&format=opensearch&q=hallow"
          probe "https://www.startpage.com/suggestions?partner=apex&format=opensearch&segment=startpage.apex.desktop&q=hallow"
          probe "https://www.startpage.com/suggestions?format=opensearch&segment=startpage.udog&q=hallow"
          probe "https://www.startpage.com/osuggestions?q=hallow"
          probe "https://www.startpage.com/opensearch.xml"
          probe "https://www.startpage.com/en/opensearch.xml"
