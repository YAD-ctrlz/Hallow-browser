<!-- Hallow logo: a halo over a glowing orb. Master for every icon size. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="40" y1="20" x2="216" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.5" stop-color="#5b2fd6"/>
      <stop offset="1" stop-color="#1f0b5c"/>
    </linearGradient>
    <radialGradient id="orb" cx="110" cy="138" r="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9e2ff"/>
      <stop offset="1" stop-color="#b9a6ff"/>
    </radialGradient>
    <linearGradient id="ring" x1="56" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ff0e0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#sky)"/>
  <circle cx="128" cy="158" r="54" fill="url(#orb)"/>
  <ellipse cx="128" cy="78" rx="72" ry="24" fill="none" stroke="url(#ring)" stroke-width="18"/>
</svg>
